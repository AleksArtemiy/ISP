{% extends "base.html" %}
{% load static %}

{% block title %}Подтверждение удаления{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 2rem auto; background: white; padding: 2rem; border-radius: 24px; border: 1px solid #e8edf3; text-align: center;">
    <h3>Удалить {{ type }}?</h3>
    <p style="margin: 1rem 0;">Вы уверены, что хотите удалить <strong>{{ object }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <div style="display: flex; gap: 1rem; justify-content: center;">
            <button type="submit" class="btn-primary" style="background: #ef4444;">Да, удалить</button>
            <a href="{% url 'admin_panel:admin_panel' %}" class="btn-primary" style="background: #94a3b8; text-decoration: none; padding: 0.5rem 1.2rem; border-radius: 40px;">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
