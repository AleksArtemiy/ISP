{% extends "base_admin.html" %}
{% load static %}

{% block content %}
<div class="admin-form-card">
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
            {{ field.label_tag }}
            {{ field }}
            {% if field.errors %}
                <div style="color:#dc2626; font-size:0.85rem; margin-top:0.2rem;">{{ field.errors }}</div>
            {% endif %}
        </div>
        {% endfor %}
        <div class="admin-form-actions">
            <button type="submit" class="admin-btn admin-btn-primary">Сохранить</button>
            <a href="{% url 'admin_panel:admin_panel' %}" class="admin-btn admin-btn-secondary">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
