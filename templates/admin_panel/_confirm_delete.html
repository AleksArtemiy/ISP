<div style="text-align:center; padding:1rem 0;">
    <h3>{% if type == 'пользователя' %}Деактивировать{% else %}Удалить{% endif %} {{ type }}?</h3>
    <p>{{ object.short_name|default:object }}{% if type == 'пользователя' %} — доступ будет отключён, история сохранится.{% endif %}</p>
    <form method="post" action="{{ request.path }}">
        {% csrf_token %}
        <div style="display:flex; gap:1rem; justify-content:center; margin-top:1.5rem;">
            <button type="submit" class="admin-btn admin-btn-danger">{% if type == 'пользователя' %}Деактивировать{% else %}Да, удалить{% endif %}</button>
            <button type="button" class="admin-btn admin-btn-secondary" onclick="closeModal()">Отмена</button>
        </div>
    </form>
</div>
